name: React Native CI/CD

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      buildType:
        description: "Select build type"
        required: false
        default: prod-apk
        type: choice
        options:
          - prod-apk

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}     # set in repo → Settings → Secrets → Actions
  NODE_OPTIONS: --openssl-legacy-provider
  EXPO_PUBLIC_WEATHER_API_KEY: ${{ secrets.EXPO_PUBLIC_WEATHER_API_KEY }}
  EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
  EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - run: echo "Proceeding with workflow"



  build-and-deploy:
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file from Secrets
        run: |
          echo "NODE_VERSION=22" > .env
          echo "EXPO_PUBLIC_WEATHER_API_KEY=${{ secrets.EXPO_PUBLIC_WEATHER_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_GROQ_API_KEY=${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}" >> .env

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies & EAS CLI
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn global add eas-cli@latest --ignore-engines

      - name: Verify EAS CLI
        run: eas --version

      # --- Android Builds ---
      # - name: Build Dev APK (Disabled)
      #   if: github.event.inputs.buildType == 'dev'
      #   run: |
      #     echo "Dev build is currently disabled."
      #     # export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
      #     # eas build --platform android --profile development --local --non-interactive --output=app-dev.apk
      #   env:
      #     NODE_ENV: development

      - name: Build Production APK
        if: github.event.inputs.buildType == 'all' || github.event.inputs.buildType == 'prod-apk' || github.event_name == 'push'
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          eas build --platform android --profile production-apk --local --non-interactive --output=app-prod.apk
        env:
          NODE_ENV: production

      # - name: Build Production AAB (Disabled)
      #   if: github.event.inputs.buildType == 'prod-aab'
      #   run: |
      #     # export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
      #     # eas build --platform android --profile production --local --non-interactive --output=app-prod.aab
      #   env:
      #     NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            app-prod.apk
          retention-days: 7
